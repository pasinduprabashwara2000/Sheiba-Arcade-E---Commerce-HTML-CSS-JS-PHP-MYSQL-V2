<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">
    <title>Sign up | Sheiba Arcade</title>
</head>
<body class="auth-page">
<div id="alert-slot"></div>

<main class="auth-card">
    <a href="index.html" class="auth-logo"><img src="img/logo.png" alt="Sheiba Arcade"></a>
    <h1>Create account</h1>
    <form id="signup-form" novalidate>
        <div class="mb-3">
            <label class="form-label" for="signup-email">Email</label>
            <input type="email" class="form-control" id="signup-email" name="email" required autocomplete="email">
        </div>
        <div class="mb-3">
            <label class="form-label" for="signup-username">Username</label>
            <input type="text" class="form-control" id="signup-username" name="username" required autocomplete="username">
        </div>
        <div class="mb-3">
            <label class="form-label" for="signup-password">Password</label>
            <input type="password" class="form-control" id="signup-password" name="password" required autocomplete="new-password">
        </div>
        <div class="mb-4">
            <label class="form-label" for="signup-confirm-password">Confirm password</label>
            <input type="password" class="form-control" id="signup-confirm-password" name="confirm" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-dark w-100" id="signup-submit-btn">Sign up</button>
    </form>
    <p class="auth-switch">Have an account? <a href="login.html">Log in</a></p>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
