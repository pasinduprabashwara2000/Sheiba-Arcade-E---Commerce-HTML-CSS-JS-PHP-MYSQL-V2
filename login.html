<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">
    <title>Log in | Sheiba Arcade</title>
</head>
<body class="auth-page">
<div id="alert-slot"></div>

<main class="auth-card">
    <a href="index.html" class="auth-logo"><img src="img/logo.png" alt="Sheiba Arcade"></a>
    <h1>Log in</h1>
    <div id="login-note" class="alert alert-info small py-2" style="display:none;" role="status"></div>
    <form id="login-form">
        <div class="mb-3">
            <label class="form-label" for="login-username">Username</label>
            <input type="text" class="form-control" id="login-username" name="username" required autocomplete="username">
        </div>
        <div class="mb-4">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" class="form-control" id="login-password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-dark w-100" id="login-submit-btn">Log in</button>
    </form>
    <p class="auth-switch">No account? <a href="signup.html">Sign up</a></p>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
