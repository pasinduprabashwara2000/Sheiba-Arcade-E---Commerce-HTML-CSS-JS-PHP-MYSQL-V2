<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <title>Manage Products | Sheiba Arcade Admin</title>
    <link href="css/admin.css" rel="stylesheet">
    <link href="css/admin-panel.css" rel="stylesheet">
    <script>
        // Hide the panel immediately for anyone who is not a signed-in admin (the API enforces this too).
        (function(){var ok=localStorage.getItem("isLoggedIn")==="true"&&localStorage.getItem("userRole")==="admin"&&localStorage.getItem("authToken");
        if(!ok){location.replace(localStorage.getItem("isLoggedIn")==="true"?"index.html":"login.html");}})();
    </script>
</head>
<body class="adm">
<aside class="adm-sidebar" id="adm-sidebar">
    <a href="admin.html" class="adm-brand">
        <img src="img/logo.png" alt="Sheiba Arcade">
        <span><strong>Sheiba Arcade</strong><small>Admin Panel</small></span>
    </a>
    <nav class="adm-nav">
        <div class="adm-nav-label">Catalogue</div>
        <a class="adm-link active" href="admin.html"><i class="bi bi-box-seam"></i> Products</a>
        <a class="adm-link" href="admin-top-selling.html"><i class="bi bi-star-fill"></i> Top Selling</a>
        <div class="adm-nav-label mt-4">Store</div>
        <a class="adm-link" href="index.html" target="_blank" rel="noopener"><i class="bi bi-shop"></i> View Storefront</a>
    </nav>
    <div class="adm-side-foot">
        <button type="button" class="adm-logout" id="adm-logout"><i class="bi bi-box-arrow-right"></i> Log out</button>
    </div>
</aside>
<div class="adm-backdrop" id="adm-backdrop"></div>

<div class="adm-main">
    <header class="adm-topbar">
        <button type="button" class="adm-toggle" id="adm-toggle" aria-label="Toggle menu"><i class="bi bi-list"></i></button>
        <h1>Product Management</h1>
        <span class="adm-spacer"></span>
        <div class="adm-chip"><span class="adm-avatar" id="adm-avatar">A</span><span id="adm-username">Admin</span></div>
    </header>

    <main>
<div class="adm-page">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h3 style="font-weight:bold" class="mb-0">Product Management</h3>
        <a href="admin-top-selling.html" class="btn btn-outline-dark">
            <i class="bi bi-star-fill me-1"></i> Manage Top Selling Products
        </a>
    </div>

    <div id="admin-alert-slot"></div>

    <form class="mb-4 form-section" id="product-form">
        <h5 class="mb-3">Add / Edit Product</h5>
        <div class="row">
            <div class="col-md-4">
                <div class="mb-2">
                    <label class="form-label">Name *</label>
                    <input type="text" class="form-control" id="f-name" placeholder="Product name">
                </div>

                <div class="mb-2">
                    <label class="form-label">Primary Image</label>
                    <input type="file" class="form-control" id="f-image" accept="image/*">
                    <small class="text-muted" id="f-image-hint"></small>
                </div>

                <div class="mb-3" id="image-preview-wrap" style="display:none;">
                    <label class="form-label">Image Preview</label>
                    <div class="image-preview-container" id="image-preview-container"></div>
                </div>

                <div class="mb-2">
                    <label class="form-label">New Price</label>
                    <input type="number" class="form-control" id="f-new-price" step="0.01">
                </div>

                <div class="mb-2">
                    <label class="form-label">Old Price</label>
                    <input type="number" class="form-control" id="f-old-price" step="0.01">
                </div>
            </div>

            <div class="col-md-4">
                <div class="mb-2">
                    <label class="form-label">Stock Quantity</label>
                    <input type="number" class="form-control" id="f-stock" min="0" value="0">
                </div>

                <div class="mb-2">
                    <label class="form-label">Stock Status *</label>
                    <select class="form-select" id="f-stock-status">
                        <option value="IN_STOCK">In Stock</option>
                        <option value="OUT_OF_STOCK">Out of Stock</option>
                    </select>
                </div>

                <div class="mb-2">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" rows="3" id="f-description"></textarea>
                </div>

                <div class="mb-2">
                    <label class="form-label">Badge</label>
                    <input type="text" class="form-control" id="f-badge" placeholder="e.g., NEW, HOT, SALE">
                </div>

                <div class="mb-2">
                    <label class="form-label">Discount (%)</label>
                    <input type="number" class="form-control" id="f-discount" step="0.01">
                </div>
            </div>

            <div class="col-md-4">
                <div class="mb-2">
                    <label class="form-label">Category *</label>
                    <select class="form-select" id="f-category">
                        <option value="">Select a category</option>
                        <option value="NEWCOMPUTERS">New Computers</option>
                        <option value="USEDCOMPUTERS">Used Computers</option>
                        <option value="USEDGAMINGCOMPUTERS">Used Gaming Computers</option>
                        <option value="NEWMONITORS">New Monitors</option>
                        <option value="USEDMONITORS">Used Monitors</option>
                        <option value="NEWLAPTOPS">New Laptops</option>
                        <option value="USEDLAPTOPS">Used Laptops</option>
                        <option value="PROCESSORS">Processors</option>
                        <option value="GRAPHICSCARD">Graphics Cards</option>
                        <option value="MOTHERBOARD">Motherboards</option>
                        <option value="RAM">RAM</option>
                        <option value="STORAGE">Storage</option>
                        <option value="POWERSUPPLY">Power Supply</option>
                        <option value="COOLINGSYSTEMS">Cooling Systems</option>
                        <option value="PCCASES">PC Cases</option>
                        <option value="ACCESSORIES">Accessories</option>
                    </select>
                </div>

                <div class="mb-2">
                    <label class="form-label">Condition *</label>
                    <select class="form-select" id="f-condition">
                        <option value="new">Brand New</option>
                        <option value="used">Used</option>
                    </select>
                </div>

                <div class="mb-2">
                    <label class="form-label">Delivery</label>
                    <input type="text" class="form-control" id="f-delivery" placeholder="e.g., 2-3 days">
                </div>

                <div class="mb-2">
                    <label class="form-label">Return Policy</label>
                    <input type="text" class="form-control" id="f-return-policy" placeholder="e.g., 30 days">
                </div>

                <div class="mb-2">
                    <label class="form-label">Shipping</label>
                    <input type="text" class="form-control" id="f-shipping" placeholder="Shipping info">
                </div>
            </div>
        </div>

        <div class="mt-3">
            <button type="submit" class="btn btn-primary" id="save-btn">Add Product</button>
            <button type="button" class="btn btn-secondary ms-2" id="cancel-edit-btn" style="display:none;">Cancel</button>
        </div>
    </form>

    <p id="loading-text" style="display:none;">Loading...</p>

    <div class="mb-4" id="filter-row" style="display:none;">
        <div class="row align-items-center">
            <div class="col-md-6">
                <label class="form-label fw-bold">Filter by Category:</label>
                <select class="form-select" id="category-filter">
                    <option value="">All Categories</option>
                    <option value="NEWCOMPUTERS">New Computers</option>
                    <option value="USEDCOMPUTERS">Used Computers</option>
                    <option value="USEDGAMINGCOMPUTERS">Used Gaming Computers</option>
                    <option value="NEWMONITORS">New Monitors</option>
                    <option value="USEDMONITORS">Used Monitors</option>
                    <option value="NEWLAPTOPS">New Laptops</option>
                    <option value="USEDLAPTOPS">Used Laptops</option>
                    <option value="PROCESSORS">Processors</option>
                    <option value="GRAPHICSCARD">Graphics Cards</option>
                    <option value="MOTHERBOARD">Motherboards</option>
                    <option value="RAM">RAM</option>
                    <option value="STORAGE">Storage</option>
                    <option value="POWERSUPPLY">Power Supply</option>
                    <option value="COOLINGSYSTEMS">Cooling Systems</option>
                    <option value="PCCASES">PC Cases</option>
                    <option value="ACCESSORIES">Accessories</option>
                </select>
            </div>
            <div class="col-md-6">
                <div class="text-end">
                    <p class="text-muted mb-0" id="products-count-text"></p>
                </div>
            </div>
        </div>
    </div>

    <div class="alert alert-info" id="empty-state" style="display:none;"></div>

    <div class="table-responsive" id="table-wrap" style="display:none;">
        <table class="table table-striped table-bordered table-hover products-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Images</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="products-tbody"></tbody>
        </table>
    </div>

    <div class="d-flex justify-content-center mt-4 mb-4" id="pagination-wrap" style="display:none;">
        <ul class="pagination" id="admin-pagination"></ul>
    </div>
</div>
    </main>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/admin-shell.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
